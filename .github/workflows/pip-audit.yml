# pip-audit: requirements.txt（GUI）と requirements-mcp.txt（MCP）の依存に既知の脆弱性がないか検査する
name: pip-audit

on:
  push:
    branches: [main]
    paths:
      - "requirements*.txt"
      - ".github/workflows/pip-audit.yml"
  pull_request:
    paths:
      - "requirements*.txt"
      - ".github/workflows/pip-audit.yml"
  schedule:
    # 毎週月曜 9:00 JST（= 日曜 0:00 UTC）に定期検査。新しく公表された脆弱性も拾う
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-mcp.txt
          pip install pip-audit

      - name: Run pip-audit
        # 実際にインストールされた環境（間接依存を含む）を検査する
        run: pip-audit --strict --desc on
